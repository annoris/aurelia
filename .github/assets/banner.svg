<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" fill="none" role="img" aria-labelledby="aurelia-banner-title aurelia-banner-desc">
  <title id="aurelia-banner-title">Aurelia AI — Enterprise Intelligence &amp; Business Automation Platform</title>
  <desc id="aurelia-banner-desc">Obsidian-slate banner for Aurelia AI showcasing document-grounded AI workspaces, visual agent flows, MCP tools, local CRM, and self-hosted deployment.</desc>
  <defs>
    <linearGradient id="banner-bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111d2e"/>
    </linearGradient>
    <radialGradient id="banner-teal-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1035 165) rotate(135) scale(420 260)">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#0f766e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="banner-gold-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 96) rotate(45) scale(260 150)">
      <stop offset="0%" stop-color="#ddbf80" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge-teal-gold" x1="875" y1="108" x2="1175" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#ddbf80"/>
    </linearGradient>
  </defs>

  <!-- Base Frame (sharp on both GitHub light and dark themes) -->
  <rect x="0.5" y="0.5" width="1279" height="359" rx="20" fill="url(#banner-bg)" stroke="#334155" stroke-opacity="0.55"/>
  <rect x="1" y="1" width="1278" height="358" rx="19.5" fill="url(#banner-teal-glow)"/>
  <rect x="1" y="1" width="1278" height="358" rx="19.5" fill="url(#banner-gold-glow)"/>

  <!-- Architectural Teal Grid Lines -->
  <g stroke="#2dd4bf" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 72H1280M0 144H1280M0 216H1280M0 288H1280"/>
    <path d="M160 0V360M320 0V360M480 0V360M640 0V360M800 0V360M960 0V360M1120 0V360"/>
  </g>

  <!-- Subtle Right Architectural Ring -->
  <circle cx="1040" cy="176" r="142" stroke="#2dd4bf" stroke-opacity="0.12" stroke-dasharray="4 6"/>
  <circle cx="1040" cy="176" r="98" stroke="#ddbf80" stroke-opacity="0.12"/>

  <!-- Brand Lockup -->
  <g transform="translate(64 56)">
    <!-- Geometric Monogram -->
    <rect width="68" height="68" rx="19" fill="#102c32" stroke="#2dd4bf" stroke-opacity="0.38" stroke-width="1.5"/>
    <g transform="translate(2 2)">
      <path d="M17 45 29 17h6l12 28h-8l-7-18-7 18z" fill="#ddbf80"/>
      <path d="M27 38h20" stroke="#ddbf80" stroke-width="3" stroke-linecap="round"/>
      <circle cx="47" cy="18" r="3.2" fill="#f5e9cc"/>
    </g>

    <!-- Title + Enterprise Intelligence Pill -->
    <text x="88" y="34" fill="#f8fafc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="4">AURELIA <tspan fill="#ddbf80">AI</tspan></text>

    <g transform="translate(88 46)">
      <rect width="244" height="24" rx="12" fill="#ddbf80" fill-opacity="0.14" stroke="#ddbf80" stroke-opacity="0.48" stroke-width="1"/>
      <circle cx="16" cy="12" r="3" fill="#ddbf80"/>
      <text x="27" y="16" fill="#ddbf80" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.2">ENTERPRISE INTELLIGENCE</text>
    </g>
  </g>

  <!-- Headline & Capabilities Subtitle -->
  <text x="64" y="198" fill="#f8fafc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.6">Put your business knowledge to work.</text>
  <text x="64" y="236" fill="#94a3b8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="500">Document-Grounded AI Workspaces · Visual Agent Flows · MCP Tools · Local CRM · Self-Hosted</text>

  <!-- Accent Rule -->
  <rect x="64" y="264" width="132" height="4" rx="2" fill="#2dd4bf"/>
  <rect x="204" y="264" width="44" height="4" rx="2" fill="#ddbf80"/>

  <!-- Bottom Meta Strip -->
  <line x1="64" y1="298" x2="796" y2="298" stroke="#334155" stroke-opacity="0.65"/>
  <text x="64" y="324" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="1.2">REACT CLIENT :3000  ·  EXPRESS + PRISMA API :3001  ·  COLLECTOR :8888  ·  PROPRIETARY LICENSE</text>

  <!-- Right-Hand Telemetry & Agent Flow Node Motif -->
  <g transform="translate(848 56)">
    <!-- Telemetry Frame -->
    <rect x="0" y="0" width="368" height="248" rx="16" fill="#111827" fill-opacity="0.88" stroke="#334155" stroke-opacity="0.75"/>
    <rect x="1" y="1" width="366" height="32" rx="15" fill="#162033"/>
    <circle cx="18" cy="17" r="3.5" fill="#475569"/>
    <circle cx="30" cy="17" r="3.5" fill="#475569"/>
    <circle cx="42" cy="17" r="3.5" fill="#2dd4bf"/>
    <text x="60" y="21" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" letter-spacing="1">AURELIA / FLOW + RAG TELEMETRY</text>

    <!-- Connector Curves -->
    <path d="M116 94 C154 94, 156 140, 192 140" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="4 3"/>
    <path d="M116 176 C154 176, 156 140, 192 140" stroke="#ddbf80" stroke-width="2" stroke-opacity="0.8"/>
    <path d="M278 140 C296 140, 298 94, 314 94" stroke="url(#edge-teal-gold)" stroke-width="2"/>
    <path d="M278 140 C296 140, 298 186, 314 186" stroke="#2dd4bf" stroke-width="2"/>

    <!-- Node 1: Knowledge Base -->
    <rect x="18" y="64" width="98" height="54" rx="10" fill="#162033" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <circle cx="32" cy="82" r="4" fill="#2dd4bf"/>
    <text x="42" y="85" fill="#f8fafc" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10.5" font-weight="600">DOCS RAG</text>
    <text x="28" y="104" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">PDF · DOCX</text>

    <!-- Node 2: Local CRM -->
    <rect x="18" y="146" width="98" height="54" rx="10" fill="#162033" stroke="#ddbf80" stroke-opacity="0.5"/>
    <circle cx="32" cy="164" r="4" fill="#ddbf80"/>
    <text x="42" y="167" fill="#f8fafc" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10.5" font-weight="600">LOCAL CRM</text>
    <text x="28" y="186" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">LEADS · SOP</text>

    <!-- Center Node: Agent Orchestrator -->
    <rect x="192" y="106" width="86" height="68" rx="12" fill="#102c32" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="235" y="130" text-anchor="middle" fill="#2dd4bf" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700">AGENT + MCP</text>
    <rect x="206" y="140" width="58" height="6" rx="3" fill="#1e293b"/>
    <rect x="206" y="140" width="42" height="6" rx="3" fill="#2dd4bf"/>
    <rect x="206" y="152" width="58" height="6" rx="3" fill="#1e293b"/>
    <rect x="206" y="152" width="50" height="6" rx="3" fill="#ddbf80"/>

    <!-- Output Pills -->
    <rect x="314" y="72" width="38" height="44" rx="8" fill="#162033" stroke="#34d399" stroke-opacity="0.6"/>
    <path d="M326 94l5 5 10-10" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="314" y="164" width="38" height="44" rx="8" fill="#162033" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <path d="M325 180h16M325 188h12M325 196h8" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round"/>

    <!-- Bottom Telemetry Readout -->
    <rect x="18" y="214" width="332" height="22" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <circle cx="31" cy="225" r="3" fill="#34d399"/>
    <text x="41" y="229" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">GROUNDED WORKSPACES · MULTI-PROVIDER · SELF-HOSTED</text>
  </g>
</svg>
